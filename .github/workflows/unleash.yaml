name: Deploy Unleash API Tokens

on:
  push:
    branches:
      - main
    paths:
      - nais/unleash/**
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      matrix:
        cluster: [dev, prod]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Deploy Unleash API Token for ${{ matrix.cluster }}
        uses: nais/deploy/actions/deploy@9850be311389ca754d9a9f2280615419d738c891 # v3
        env:
          CLUSTER: ${{ matrix.cluster }}-gcp
          RESOURCE: nais/unleash/${{ matrix.cluster }}.yaml
